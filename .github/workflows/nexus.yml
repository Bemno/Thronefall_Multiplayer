name: Upload release to Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. v1.3.1)
        required: true

jobs:
  nexus:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.dll' --dir assets
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > changelog.txt

      - name: Build Nexus archive
        run: |
          VERSION="${TAG#v}"
          mkdir -p pkg/BepInEx/plugins/ThronefallMultiplayer
          cp assets/com.badwolf.thronefall_mp.dll pkg/BepInEx/plugins/ThronefallMultiplayer/
          cp assets/Thronefall-Multiplayer-Installer.exe pkg/
          (cd pkg && zip -r "../Thronefall-Multiplayer-$VERSION.zip" .)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo 'CHANGELOG<<EOF'
            cat changelog.txt
            echo
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: Thronefall-Multiplayer-${{ env.VERSION }}.zip
          version: ${{ env.VERSION }}
          display_name: Thronefall Multiplayer ${{ env.VERSION }}
          archive_existing_version: true
          update_mod_version: true
          changelog: ${{ env.CHANGELOG }}
